<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakery System - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* 1. Body layout setup */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }

    /* 2. Isolated Full-Screen Background Image with Ultra-Fast Zoom Animation */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(61, 35, 20, 0.55), rgba(30, 15, 8, 0.6)), url('kitchen-bg-1.jpg') no-repeat center center;
      background-size: cover;
      z-index: -1;
      /* Speed up to 0.35s with snappy cubic-bezier curve */
      animation: bgZoomIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }

    /* 3. Login card styling */
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 40px 45px;
      margin: 20px;
      border-radius: 18px;

      background-color: #fbf6ee;
      border: 1px solid #e4d3ba;
      box-shadow: 0 20px 45px rgba(30, 15, 8, 0.35) !important;

      /* Faster, smooth card fade-in */
      animation: cardFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #a8641f;
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    /* 4. Text color adjustments (Dark Brown Theme) */
    .login-card h3 {
      font-family: 'Fraunces', serif;
      font-size: 1.9rem;
      color: #3d2314 !important;
      font-weight: 700;
    }

    .login-card .brand-rule {
      width: 48px;
      height: 3px;
      background: #c9922e;
      border-radius: 3px;
      margin: 6px auto 18px;
    }

    .form-label, .text-muted {
      color: #4a2c11 !important;
      font-weight: 600;
    }

    .login-card a, a.small, a.text-decoration-none {
      color: #a8641f !important;
      font-weight: 600;
    }

    .login-card a:hover {
      color: #2d1a0e !important;
      text-decoration: underline !important;
    }

    /* 5. Maroon Login Button Styling */
    .btn-maroon {
      background-color: #800020 !important;
      border-color: #800020 !important;
      color: #ffffff !important;
      transition: background-color 0.3s ease-in-out, border-color 0.3s ease-in-out;
    }

    .btn-maroon:hover {
      background-color: #5c0016 !important;
      border-color: #5c0016 !important;
    }

    /* 6. Solid white input fields */
    .login-card .form-control {
      background-color: #ffffff !important;
      border: 1px solid #dcccb4;
      color: #212529;
      border-radius: 8px;
    }

    .login-card .form-control:focus {
      border-color: #c9922e;
      box-shadow: 0 0 0 0.2rem rgba(201, 146, 46, 0.2);
    }

    /* 7. Keyframe Animations */
    
    /* Fast Entrance Zoom (Scale 1.10 -> 1.0) */
    @keyframes bgZoomIn {
      from {
        transform: scale(1.10);
        opacity: 0.5;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Smooth Card Fade */
    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Fast Exit Zoom */
    body.zoom-out::before {
      animation: bgZoomOut 0.2s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    @keyframes bgZoomOut {
      from {
        transform: scale(1);
        opacity: 1;
      }
      to {
        transform: scale(1.08);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card shadow-lg login-card">
    <div class="brand-mark"><i class="bi bi-egg-fried"></i></div>
    <h3 class="text-center mb-0 fw-bold">BakeWise</h3>
    <div class="brand-rule"></div>
    <p class="text-center text-muted mb-4 small">Smart Bakery Ingredient Tracking System</p>
    
    <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="staff@bakery.com" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="******" required>
      </div>

      <div class="text-center mt-2 mb-3">
        <a href="#" id="forgotPasswordLink" class="text-decoration-none">Forgot Password?</a>
      </div>
      
      <button type="submit" class="btn btn-maroon w-100 fw-bold">Login</button>
    </form>

    <div class="text-center mt-3">
      <a href="register.html" class="text-decoration-none small">Don't have an account? Register here</a>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const navLinks = document.querySelectorAll('a[href$=".html"]');
      navLinks.forEach(link => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          const targetUrl = link.getAttribute("href");
          document.body.classList.add("zoom-out");
          /* Reduced to 200ms to match the rapid exit animation */
          setTimeout(() => {
            window.location.href = targetUrl;
          }, 200);
        });
      });
    });
  </script>
</body>
</html>
