<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakery System - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .login-card { max-width: 400px; margin: 80px auto; padding: 25px; border-radius: 10px; }
  </style>
</head>
<body>

  <div class="card shadow-sm login-card bg-white">
    <h3 class="text-center mb-2 text-primary fw-bold">Bakery Management</h3>
    <p class="text-center text-muted mb-4 small">Sistem Pengurusan Bahan Kedai Bakery</p>
    
    <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="staff@bakery.com" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="******" required>
      </div>

      <div class="text-center mt-2 mb-3">
        <a href="#" id="forgotPasswordLink" class="text-decoration-none">Forgot Password?</a>
      </div>
      
      <button type="submit" class="btn btn-primary w-100 fw-bold">Login</button>
    </form>

    <div class="text-center mt-3">
      <a href="register.html" class="text-decoration-none small">Don't have an account? Register here</a>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
