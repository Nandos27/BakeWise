<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BakeWise - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* 1. Main Background */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      background: url('kitchen-bg-1.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      z-index: -1;
    }

    /* 2. Main Card Container (FIXED: removed fixed height) */
    .login-container {
      display: flex;
      width: 100%;
      max-width: 1000px;
      min-height: 600px; /* Allows it to grow if needed */
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      background-color: transparent;
      animation: fadeIn 0.4s ease-out forwards;
    }

    /* 3. Left Side: Glassmorphism Form Area */
    .login-left {
      width: 50%;
      background: rgba(30, 40, 30, 0.7);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      color: #ffffff;
    }

    /* 4. Right Side: Clear Image */
    .login-right {
      width: 50%;
      background: url('kitchen-bg.jpg') no-repeat center center;
      background-size: cover;
    }

    /* 5. Top Navigation Links */
    .top-nav {
      display: flex;
      align-items: center;
      margin-bottom: 50px;
    }
    
    .menu-icon {
      font-size: 1.5rem;
      color: #9e9e9e;
      margin-right: 30px;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .nav-links .active {
      color: #4caf50;
    }

    .nav-links .inactive {
      color: #b0b0b0;
      border-bottom: 1px solid #666;
      padding-bottom: 3px;
    }

    /* 6. Greeting Text */
    .greeting h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .greeting p {
      font-size: 0.85rem;
      color: #d1d1d1;
      letter-spacing: 0.5px;
      margin-bottom: 35px;
      text-transform: uppercase;
    }

    /* 7. Input Fields */
    .custom-input-group {
      margin-bottom: 20px;
    }

    .custom-input-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 16px 20px;
      border-radius: 5px;
      font-size: 0.9rem;
      outline: none;
      transition: background 0.3s, border 0.3s;
    }

    .custom-input-group input::placeholder {
      color: #c4c4c4;
    }

    .custom-input-group input:focus {
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid #4caf50;
    }

    /* 8. Options Row */
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 30px;
      color: #c4c4c4;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .options-row a {
      color: #c4c4c4;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.3s;
    }

    .options-row a:hover {
      color: #ffffff;
    }

    /* 9. Submit Button */
    .btn-login {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 14px 40px;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      width: fit-content;
      transition: background-color 0.3s;
      letter-spacing: 1px;
    }

    .btn-login:hover {
      background-color: #1b5e20;
    }

    /* 10. Bottom Logo */
    .bottom-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Oswald', sans-serif; /* Matches the Welcome heading */
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: auto; 
      padding-top: 40px; 
      letter-spacing: 0.5px;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
        height: auto;
      }
      .login-left, .login-right {
        width: 100%;
      }
      .login-right {
        height: 200px;
        order: -1; 
      }
      .bottom-logo {
        display: none;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <!-- LEFT SIDE: Glassmorphism Panel -->
    <div class="login-left">
      
      <!-- Top Nav -->
      <div class="top-nav">
        <i class="bi bi-list menu-icon"></i>
        <div class="nav-links">
          <a href="#" class="active">Login</a>
          <a href="register.html" class="inactive">Register Now</a>
        </div>
      </div>

      <!-- Greeting -->
      <div class="greeting">
        <h1>WELCOME!</h1>
        <p>TO BAKEWISE LOGIN PAGE.</p>
      </div>

      <!-- Alert Box -->
      <div id="errorAlert" class="alert alert-danger d-none py-2 mb-3" style="font-size: 0.85rem;" role="alert"></div>

      <!-- Login Form -->
      <form id="loginForm">
        
        <div class="custom-input-group">
          <input type="email" id="email" placeholder="Email Address" required>
        </div>
        
        <div class="custom-input-group">
          <input type="password" id="password" placeholder="Password" required>
        </div>

        <div class="options-row">
          <label class="checkbox-container">
            <input type="checkbox" id="showPasswordToggle">
            Show Password
          </label>
          <a href="#" id="forgotPasswordLink"><i class="bi bi-key-fill"></i> Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login">LOGIN</button>
      </form>

      <!-- Branding Logo & Text -->
      <div class="bottom-logo"><i class="bi bi-egg-fried"></i> BakeWise</div>

    </div>

    <!-- RIGHT SIDE: Clear Image -->
    <div class="login-right"></div>

  </div>

  <script type="module" src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const showPasswordToggle = document.getElementById('showPasswordToggle');
      const passwordInput = document.getElementById('password');

      if (showPasswordToggle && passwordInput) {
        showPasswordToggle.addEventListener('change', function() {
          passwordInput.type = this.checked ? 'text' : 'password';
        });
      }
    });
  </script>
</body>
</html>
