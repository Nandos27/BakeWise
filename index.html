<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BakeWise - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* 1. Main Background */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      background: url('kitchen-bg.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    /* Slightly warmer dark overlay to complement the brown */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 10, 5, 0.5); 
      backdrop-filter: blur(0px); 
      z-index: -1;
    }

    /* 2. Main Card Container */
    .login-container {
      display: flex;
      width: 100%;
      max-width: 1000px;
      min-height: 600px; 
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7); 
      background-color: transparent;
      animation: fadeIn 0.4s ease-out forwards;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* 3. Left Side: Enhanced Frosted Glassmorphism Area */
    .login-left {
      width: 50%;
      background: rgba(45, 30, 20, 0.65); 
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-right: 1px solid rgba(255, 255, 255, 0.08); 
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      color: #ffffff;
    }

    /* 4. Right Side: Image Container */
    .login-right {
      width: 50%;
      background-color: rgba(211, 84, 0, 0.1); 
      background: url('kitchen-bg-2.jpeg') no-repeat center center;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* 5. Top Navigation Links */
    .top-nav {
      display: flex;
      align-items: center;
      margin-bottom: 50px;
    }
    
    .menu-icon {
      font-size: 1.5rem;
      color: #9e9e9e;
      margin-right: 30px;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: color 0.3s;
    }

    /* Updated to Orange */
    .nav-links .active {
      color: #D35400; 
    }

    .nav-links .inactive {
      color: #b0b0b0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 3px;
    }

    .nav-links .inactive:hover {
      color: #ffffff;
    }

    /* 6. Greeting Text */
    .greeting h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .greeting p {
      font-size: 0.85rem;
      color: #d1d1d1;
      letter-spacing: 0.5px;
      margin-bottom: 35px;
      text-transform: uppercase;
    }

    /* 7. Input Fields */
    .custom-input-group {
      margin-bottom: 20px;
    }

    .custom-input-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 16px 20px;
      border-radius: 5px;
      font-size: 0.9rem;
      outline: none;
      transition: background 0.3s, border 0.3s, box-shadow 0.3s;
    }

    .custom-input-group input::placeholder {
      color: #c4c4c4;
    }

    /* Glow effect matching the orange theme */
    .custom-input-group input:focus {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid #D35400;
      box-shadow: 0 0 8px rgba(211, 84, 0, 0.4);
    }

    /* 8. Options Row */
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 30px;
      color: #c4c4c4;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .options-row a {
      color: #c4c4c4;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.3s;
    }

    .options-row a:hover {
      color: #ffffff;
    }

    /* 9. Submit Button */
    .btn-login {
      background-color: #D35400;
      color: white;
      border: none;
      padding: 14px 40px;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      width: fit-content;
      transition: background-color 0.3s, transform 0.1s;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(211, 84, 0, 0.3);
    }

    .btn-login:hover {
      background-color: #E67E22;
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    /* 10. Bottom Logo (Reverted text back to white for visibility) */
    .bottom-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Oswald', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: auto; 
      padding-top: 40px; 
      letter-spacing: 0.5px;
      cursor: pointer;
      width: fit-content;
    }

    .bakery-pie-icon {
      width: 32px;
      height: 32px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .bakery-pie-icon .pie-slice {
      transition: transform 0.3s ease;
      transform-origin: center;
    }

    .bottom-logo:hover .bakery-pie-icon {
      transform: scale(1.1) rotate(5deg);
    }
    
    .bottom-logo:hover .pie-slice {
      transform: translate(3px, -3px); 
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
        height: auto;
      }
      .login-left, .login-right {
        width: 100%;
      }
      .login-right {
        height: 200px;
        order: -1; 
      }
      .bottom-logo {
        display: none;
      }
      .login-left {
        border-right: none;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <!-- LEFT SIDE: Glassmorphism Panel -->
    <div class="login-left">
      
      <!-- Top Nav -->
      <div class="top-nav">
        <i class="bi bi-list menu-icon"></i>
        <div class="nav-links">
          <a href="#" class="active">Login</a>
          <a href="register.html" class="inactive">Register Now</a>
        </div>
      </div>

      <!-- Greeting -->
      <div class="greeting">
        <h1>WELCOME!</h1>
        <p>TO BAKEWISE LOGIN PAGE.</p>
      </div>

      <!-- Alert Box -->
      <div id="errorAlert" class="alert alert-danger d-none py-2 mb-3" style="font-size: 0.85rem;" role="alert"></div>

      <!-- Login Form -->
      <form id="loginForm">
        
        <div class="custom-input-group">
          <input type="email" id="email" placeholder="Email Address" required>
        </div>
        
        <div class="custom-input-group">
          <input type="password" id="password" placeholder="Password" required>
        </div>

        <div class="options-row">
          <label class="checkbox-container">
            <input type="checkbox" id="showPasswordToggle">
            Show Password
          </label>
          <a href="#" id="forgotPasswordLink"><i class="bi bi-key-fill"></i> Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login">LOGIN</button>
      </form>

      <!-- Branding Logo (Bottom Corner) -->
      <div class="bottom-logo">
        <svg class="bakery-pie-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="11" fill="#4a3123" />
          <circle cx="12" cy="12" r="9" fill="#D35400" />
          <line x1="12" y1="12" x2="5" y2="19" stroke="#4a3123" stroke-width="1.5" />
          <line x1="12" y1="12" x2="3" y2="12" stroke="#4a3123" stroke-width="1.5" />
          <g class="pie-slice">
            <path d="M12 12 L21 12 A9 9 0 0 0 12 3 Z" fill="#E67E22" />
            <path d="M12 12 L22 12 A10 10 0 0 0 12 2 Z" fill="none" stroke="#2D1E14" stroke-width="2"/>
          </g>
        </svg>
        BakeWise
      </div>

    </div>

    <!-- RIGHT SIDE: Clear Image -->
    <div class="login-right"></div>

  </div>

  <script type="module" src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const showPasswordToggle = document.getElementById('showPasswordToggle');
      const passwordInput = document.getElementById('password');

      if (showPasswordToggle && passwordInput) {
        showPasswordToggle.addEventListener('change', function() {
          passwordInput.type = this.checked ? 'text' : 'password';
        });
      }
    });
  </script>
</body>
</html>
