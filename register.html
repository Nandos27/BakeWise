<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BakeWise - Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* 1. Main Background */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      background: url('kitchen-bg.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    /* Warmer dark overlay matching the login page */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 10, 5, 0.5);
      backdrop-filter: blur(0px);
      z-index: -1;
    }

    /* 2. Main Card Container */
    .login-container {
      display: flex;
      width: 100%;
      max-width: 1000px;
      min-height: 600px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
      background-color: transparent;
      animation: fadeIn 0.4s ease-out forwards;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* 3. Left Side: Enhanced Frosted Glassmorphism Area */
    .login-left {
      width: 50%;
      background: rgba(45, 30, 20, 0.65);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      color: #ffffff;
    }

    /* 4. Right Side: Clear Image */
    .login-right {
      width: 50%;
      background: url('kitchen-bg-2.jpeg') no-repeat center center;
      background-size: cover;
    }

    /* 5. Top Navigation Links */
    .top-nav {
      display: flex;
      align-items: center;
      margin-bottom: 40px;
    }

    .menu-icon {
      font-size: 1.5rem;
      color: #9e9e9e;
      margin-right: 30px;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: color 0.3s;
    }

    .nav-links .active {
      color: #D35400;
    }

    .nav-links .inactive {
      color: #b0b0b0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 3px;
    }

    .nav-links .inactive:hover {
      color: #ffffff;
    }

    /* 6. Greeting Text */
    .greeting h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .greeting p {
      font-size: 0.85rem;
      color: #d1d1d1;
      letter-spacing: 0.5px;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    /* 7. Input Fields */
    .custom-input-group {
      margin-bottom: 16px;
    }

    .custom-input-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 14px 20px;
      border-radius: 5px;
      font-size: 0.9rem;
      outline: none;
      transition: background 0.3s, border 0.3s, box-shadow 0.3s;
    }

    .custom-input-group input::placeholder {
      color: #c4c4c4;
    }

    .custom-input-group input:focus {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid #D35400;
      box-shadow: 0 0 8px rgba(211, 84, 0, 0.4);
    }

    .custom-input-group .form-text {
      color: #b0b0b0 !important;
      font-size: 0.78rem;
      margin-top: 4px;
    }

    /* 8. Submit Button */
    .btn-login {
      background-color: #D35400;
      color: white;
      border: none;
      padding: 14px 40px;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      width: fit-content;
      transition: background-color 0.3s, transform 0.1s;
      letter-spacing: 1px;
      margin-top: 8px;
      box-shadow: 0 4px 15px rgba(211, 84, 0, 0.3);
    }

    .btn-login:hover {
      background-color: #E67E22;
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
        height: auto;
      }
      .login-left, .login-right {
        width: 100%;
      }
      .login-right {
        height: 200px;
        order: -1;
      }
      .login-left {
        border-right: none;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="login-container">

    <!-- LEFT SIDE: Glassmorphism Panel -->
    <div class="login-left">

      <!-- Top Nav -->
      <div class="top-nav">
        <i class="bi bi-list menu-icon"></i>
        <div class="nav-links">
          <a href="index.html" class="inactive">Login</a>
          <a href="#" class="active">Register Now</a>
        </div>
      </div>

      <!-- Greeting -->
      <div class="greeting">
        <h1>CREATE ACCOUNT</h1>
        <p>JOIN BAKEWISE TO GET STARTED.</p>
      </div>

      <!-- Alert Box -->
      <div id="alertBox" class="alert alert-danger d-none py-2 mb-3" style="font-size: 0.85rem;" role="alert"></div>

      <!-- Register Form -->
      <form id="registerForm">

        <div class="custom-input-group">
          <input type="text" id="regFullName" placeholder="Full Name" required>
        </div>

        <div class="custom-input-group">
          <input type="email" id="regEmail" placeholder="Email Address" required>
        </div>

        <div class="custom-input-group">
          <input type="password" id="regPassword" placeholder="Password" required>
          <div class="form-text">At least 6 characters, containing numbers & letters.</div>
        </div>

        <div class="custom-input-group">
          <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required>
        </div>

        <button type="submit" class="btn-login">CREATE ACCOUNT</button>
      </form>

    </div>

    <!-- RIGHT SIDE: Clear Image -->
    <div class="login-right"></div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
