<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakery System - Register Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* 1. Full-screen background image matching login page */
    body {
      background: linear-gradient(rgba(61, 35, 20, 0.55), rgba(30, 15, 8, 0.6)), url('kitchen-bg-1.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: zoomIn 0.4s ease-out forwards;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
    }

    /* 2. Register card, matching login card styling */
    .register-card {
      width: 100%;
      max-width: 450px;
      padding: 40px 45px;
      margin: 20px;
      border-radius: 18px;

      background-color: #fbf6ee;
      border: 1px solid #e4d3ba;
      box-shadow: 0 20px 45px rgba(30, 15, 8, 0.35) !important;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #a8641f;
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    /* 3. Title area */
    .title-badge {
      text-align: center;
      padding-bottom: 6px;
      margin-bottom: 22px;
    }

    .title-badge .brand-rule {
      width: 48px;
      height: 3px;
      background: #c9922e;
      border-radius: 3px;
      margin: 6px auto 12px;
    }

    /* 4. Text color adjustments (Dark Brown Theme) */
    .register-card h3 {
      font-family: 'Fraunces', serif;
      font-size: 1.9rem;
      color: #3d2314 !important; /* Deep Espresso Brown */
      font-weight: 700;
    }

    .form-label, .text-muted, .form-text {
      color: #4a2c11 !important; /* Dark Chocolate Brown */
      font-weight: 600;
    }

    .register-card a, a.small, a.text-decoration-none {
      color: #a8641f !important; /* Warm accent for links */
      font-weight: 600;
    }

    .register-card a:hover {
      color: #2d1a0e !important;
      text-decoration: underline !important;
    }

    /* 5. Maroon Create Account Button Styling */
    .btn-maroon {
      background-color: #800020 !important;
      border-color: #800020 !important;
      color: #ffffff !important;
      transition: background-color 0.3s ease-in-out, border-color 0.3s ease-in-out;
    }

    .btn-maroon:hover {
      background-color: #5c0016 !important;
      border-color: #5c0016 !important;
    }

    /* 6. Solid white input fields */
    .register-card .form-control {
      background-color: #ffffff !important;
      border: 1px solid #dcccb4;
      color: #212529;
      border-radius: 8px;
    }

    .register-card .form-control:focus {
      border-color: #c9922e;
      box-shadow: 0 0 0 0.2rem rgba(201, 146, 46, 0.2);
    }

    /* 7. Animations */
    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    body.zoom-out {
      animation: zoomOut 0.3s ease-in forwards;
    }

    @keyframes zoomOut {
      from {
        opacity: 1;
        transform: scale(1);
      }
      to {
        opacity: 0;
        transform: scale(1.05);
      }
    }
  </style>
</head>
<body>

  <div class="card shadow-lg register-card">
    <!-- Title & Subtitle -->
    <div class="title-badge">
      <div class="brand-mark"><i class="bi bi-egg-fried"></i></div>
      <h3 class="mb-0 fw-bold">Register Account</h3>
      <div class="brand-rule"></div>
      <p class="text-muted mb-0 small">Create an account to access BakeWise</p>
    </div>
    
    <div id="alertBox" class="alert d-none" role="alert"></div>

    <form id="registerForm">
      <div class="mb-3">
        <label for="regFullName" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="regFullName" placeholder="John Doe" required>
      </div>

      <div class="mb-3">
        <label for="regEmail" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="regEmail" placeholder="staff@bakery.com" required>
      </div>

      <div class="mb-3">
        <label for="regPassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="regPassword" placeholder="Min 6 chars (e.g. Pass123!)" required>
        <div class="form-text small">At least 6 characters, containing numbers & letters.</div>
      </div>

      <div class="mb-3">
        <label for="regConfirmPassword" class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="regConfirmPassword" placeholder="Repeat password" required>
      </div>

      <button type="submit" class="btn btn-maroon w-100 fw-bold">Create Account</button>
    </form>

    <div class="text-center mt-3">
      <a href="index.html" class="text-decoration-none small">Already have an account? Login here</a>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const navLinks = document.querySelectorAll('a[href$=".html"]');
      navLinks.forEach(link => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          const targetUrl = link.getAttribute("href");
          document.body.classList.add("zoom-out");
          setTimeout(() => {
            window.location.href = targetUrl;
          }, 300);
        });
      });
    });
  </script>
</body>
</html>
